services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trajectory
      POSTGRES_PASSWORD: trajectory
      POSTGRES_DB: trajectory
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trajectory -d trajectory"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://trajectory:trajectory@postgres:5432/trajectory
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
